[project]
name = "genshinvox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "hf-xet>=1.6.0",
    "huggingface-hub>=0.36.2",
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "numpy>=2.5.2",
    "openai-whisper>=20250625",
    "peft>=0.20.0",
    "pyannote-audio>=4.0.7",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "qwen-tts",
    "soundfile>=0.14.0",
    "torch>=2.8.0",
    "torchcodec",
    "torchaudio>=2.11.0",
    "wandb>=0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
torchaudio = [{ index = "pytorch-cuda" }]
torchcodec = [{ index = "pytorch-cuda"}]
qwen-tts = { workspace = true }

[tool.uv.workspace]
members = [
    "qwen_tts",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
